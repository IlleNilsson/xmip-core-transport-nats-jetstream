# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-transport-nats-jetstream"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport-nats-jetstream"
description = "NATS JetStream transport: durable streams and pull consumers over NATS — publish acknowledged by sequence, fetch a batch, acknowledge each — a subject is a Location that survives a restart. A xmip-core-transport technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). JetStream is core NATS with a request/reply API on
# top, so the wire comes from the nats technology and the JSON the API
# speaks from serde_json.
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }
nats = { package = "xmip-core-transport-nats", git = "https://github.com/IlleNilsson/xmip-core-transport-nats", branch = "main" }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
