[package]
name = "xmip-core-transport-nats-jetstream"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-nats-jetstream"
description = "NATS JetStream transport: durable streams and pull consumers over NATS — publish acknowledged by sequence, fetch a batch, acknowledge each — a subject is a Location that survives a restart. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). JetStream is core NATS with a request/reply API on
# top, so the wire comes from the nats technology and the JSON the API
# speaks from serde_json. Its declaration takes the capability's `timeout`
# (`transport::configured::timeout`).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }
# A target read as a URI writes it (`net::Target`).
net = { package = "xmip-core-library-net", git = "https://github.com/IlleNilsson/xmip-core-library-net", branch = "main", optional = true }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
# The wire, and the `name` setting both declare (`nats::declaration::NAME`):
# its declaration alone where this crate is.
nats = { package = "xmip-core-transport-nats", git = "https://github.com/IlleNilsson/xmip-core-transport-nats", branch = "main", default-features = false }
serde_json = { version = "1", optional = true }
# The inbox this connection listens on is named from random bytes, spelled
# in hex (codec's `random` and `hex`).
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main", optional = true }

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "nats/default", "dep:net", "dep:serde_json", "dep:codec"]
# The declaration alone, the nats technology's `name` among its settings.
declaration = ["nats/declaration"]

# The module's timing program (doc/governance/rust-style.md section 5c): a
# plain cargo test leaves it out, and the landing runs it after every other
# test here, alone, one test at a time, so what it measures is Xmip's work.
[[test]]
name = "measured"
path = "tests/measured/main.rs"
test = false

[dev-dependencies]
# The loopback payloads the tests drive, from the capability's test
# support and never a production build (ADR-0044).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main", features = ["test-support"] }

[lints]
workspace = true
